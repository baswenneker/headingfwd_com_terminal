<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="som-titel som-desc">
  <title id="som-titel">De AI-rekening als vermenigvuldiging van vier factoren</title>
  <desc id="som-desc">De prijs per token daalt met 60% per modelgeneratie. Daartegenover staan drie
  stijgende factoren: agentic coding verbruikt ongeveer duizend keer zoveel tokens per taak, de
  taaklengte die agents aankunnen verdubbelt elke 124 dagen, en 90% van de developers gebruikt AI
  wekelijks. Samen laten ze de AI-rekening stijgen.</desc>

  <g font-family="monospace">
    <!-- rij 1: de enige dalende factor -->
    <text x="14" y="34" font-size="15" fill="var(--ink-dim, currentColor)"> </text>
    <text x="34" y="34" font-size="15" fill="var(--ink-strong, currentColor)">prijs per token</text>
    <g stroke="var(--ink-dim, currentColor)" stroke-width="1.6" fill="none">
      <path d="M308 20v15"/>
      <path d="M303 30l5 5 5-5"/>
    </g>
    <text x="336" y="34" font-size="13" fill="var(--ink-dim, currentColor)">60% lager per generatie</text>

    <!-- rij 2 -->
    <text x="14" y="79" font-size="15" fill="var(--ink-dim, currentColor)">×</text>
    <text x="34" y="79" font-size="15" fill="var(--ink-strong, currentColor)">tokens per taak</text>
    <g stroke="var(--accent, currentColor)" stroke-width="1.6" fill="none">
      <path d="M308 80V65"/>
      <path d="M303 70l5-5 5 5"/>
    </g>
    <text x="336" y="79" font-size="13" fill="var(--ink-dim, currentColor)">~1.000× bij agentic coding</text>

    <!-- rij 3 -->
    <text x="14" y="124" font-size="15" fill="var(--ink-dim, currentColor)">×</text>
    <text x="34" y="124" font-size="15" fill="var(--ink-strong, currentColor)">taken per developer</text>
    <g stroke="var(--accent, currentColor)" stroke-width="1.6" fill="none">
      <path d="M308 125V110"/>
      <path d="M303 115l5-5 5 5"/>
    </g>
    <text x="336" y="124" font-size="13" fill="var(--ink-dim, currentColor)">taaklengte ×2 per 124 dagen</text>

    <!-- rij 4 -->
    <text x="14" y="169" font-size="15" fill="var(--ink-dim, currentColor)">×</text>
    <text x="34" y="169" font-size="15" fill="var(--ink-strong, currentColor)">developers met AI</text>
    <g stroke="var(--accent, currentColor)" stroke-width="1.6" fill="none">
      <path d="M308 170V155"/>
      <path d="M303 160l5-5 5 5"/>
    </g>
    <text x="336" y="169" font-size="13" fill="var(--ink-dim, currentColor)">90% gebruikt het wekelijks</text>

    <!-- streep -->
    <path d="M14 196h532" stroke="var(--rule, currentColor)" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- uitkomst -->
    <text x="14" y="236" font-size="15" fill="var(--ink-dim, currentColor)">=</text>
    <text x="34" y="236" font-size="18" fill="var(--accent, currentColor)">de AI-rekening</text>
    <g stroke="var(--accent, currentColor)" stroke-width="2.2" fill="none">
      <path d="M246 239V214"/>
      <path d="M238 222l8-8 8 8"/>
    </g>

    <text x="34" y="278" font-size="13" fill="var(--ink-dim, currentColor)">Eén factor daalt. Drie stijgen harder.</text>
  </g>
</svg>
