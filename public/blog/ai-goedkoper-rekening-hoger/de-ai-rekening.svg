<!--
  The AI bill as a product of four factors: one falls, three rise.

  Each factor gets a sparkline: an axis, the line, and a fill fading from the
  line down to that axis. The axis sits 3 units under its own text baseline, so
  a line reads as belonging to the row it is drawn on rather than floating
  between two.

  The three rising lines share one shape and the falling one is that shape
  mirrored. They carry no magnitude — these factors are not measured against
  each other — so giving them different slopes would claim a precision the post
  does not have.

  Drawn at 460 × 250 with 12- and 13-unit text for the same reason charts.ts
  gives: everything inside a viewBox scales with the rendered width, labels
  included, so a wider drawing shrinks its own text on a phone. At this size
  the labels still land near 10px in the narrowest body column.

  The arrows are paths, not ↑ / ↓ glyphs. JetBrains Mono has no arrows, so the
  browser fell back to another face and drew them thinner and smaller than
  everything around them. As paths they carry the same stroke width as the
  lines and their size is ours to set.

  Because an arrow sits at a fixed x, the notes are left-aligned beside it
  rather than right-aligned against the edge: their start has to be known, and
  a text width is not.

  No colour is set. The stylesheet paints the figure with the page accent, and
  every stroke, fill and gradient stop here follows currentColor.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" role="presentation">
  <defs>
    <!-- Bounding-box units, so one gradient serves all four fills. -->
    <linearGradient id="de-ai-rekening-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".32"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g font-family="monospace" fill="currentColor">
    <g fill="url(#de-ai-rekening-fade)">
      <path d="M200 20 223 24 246 30 270 37V41H200Z"/>
      <path d="M200 83 223 79 246 73 270 66V87H200Z"/>
      <path d="M200 129 223 125 246 119 270 112V133H200Z"/>
      <path d="M200 175 223 171 246 165 270 158V179H200Z"/>
    </g>

    <g fill="none" stroke="currentColor" stroke-width="1" opacity=".3">
      <path d="M200 41h70M200 87h70M200 133h70M200 179h70"/>
    </g>

    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="200,20 223,24 246,30 270,37"/>
      <polyline points="200,83 223,79 246,73 270,66"/>
      <polyline points="200,129 223,125 246,119 270,112"/>
      <polyline points="200,175 223,171 246,165 270,158"/>
    </g>
    <circle cx="270" cy="37" r="2.5"/>
    <circle cx="270" cy="66" r="2.5"/>
    <circle cx="270" cy="112" r="2.5"/>
    <circle cx="270" cy="158" r="2.5"/>

    <!-- Arrows: down for the one factor that falls, up for the three that rise. -->
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
      <path d="M296 28v11M292.5 35.5 296 39l3.5-3.5"/>
      <path d="M296 85V74M292.5 77.5 296 74l3.5 3.5"/>
      <path d="M296 131v-11M292.5 123.5 296 120l3.5 3.5"/>
      <path d="M296 177v-11M292.5 169.5 296 166l3.5 3.5"/>
      <path d="M296 227v-11M292.5 219.5 296 216l3.5 3.5"/>
    </g>

    <g font-size="13">
      <text x="30" y="38">prijs per token</text>
      <text x="30" y="84">tokens per taak</text>
      <text x="30" y="130">taken per developer</text>
      <text x="30" y="176">developers met AI</text>
      <text x="30" y="226">de AI-rekening</text>
    </g>

    <g font-size="13" opacity=".45">
      <text x="12" y="84">&#215;</text>
      <text x="12" y="130">&#215;</text>
      <text x="12" y="176">&#215;</text>
      <text x="12" y="226">=</text>
    </g>

    <g font-size="12" opacity=".72">
      <text x="310" y="38">&#8722;60% per generatie</text>
      <text x="310" y="84">reasoning en loops</text>
      <text x="310" y="130">meer delegeren</text>
      <text x="310" y="176">bredere adoptie</text>
      <text x="310" y="226">per saldo omhoog</text>
    </g>

    <path d="M12 200h438" stroke="currentColor" stroke-width="1" opacity=".3"/>
  </g>
</svg>
