# Written by /fwd:setup-review. Re-running it never overwrites this file.
# New CVEs in dependencies that did not change, so no pull request would show them.
name: fwd-osv-weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      upload-sarif: false
