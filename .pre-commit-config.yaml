# Written by /fwd:setup-review. Re-running it never overwrites this file.
# `pre-commit install` installs both the commit and the push hook.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # The project's own Prettier and ESLint (npx --no-install), not a second copy.
      - id: prettier
        name: prettier --check
        entry: npx --no-install prettier --check --ignore-unknown
        language: system
        types: [text]
        # Parallel batches race on Prettier's shared cache file (ENOENT on unlink).
        require_serial: true
      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        types_or: [javascript, jsx, ts, tsx]
      # Asks the Workcenter reviewer to look at the branch; returns at once.
      - id: fwd-review-push
        name: Workcenter reviewer (background)
        entry: .claude/fwd/review-push.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        # pre-commit hides what a passing hook prints; the reviewer's warning
        # must show.
        verbose: true
